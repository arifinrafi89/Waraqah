name: waraqah
description: "Waraqah - a Flutter book marketplace, P2P resale, social reading feed and AI assistant."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^17.2.1

  # State management
  flutter_riverpod: ^3.0.3
  provider: ^6.1.5+1

  # Networking
  dio: ^5.9.0

  # Models / codegen runtime
  freezed_annotation: ^3.1.0
  json_annotation: ^4.10.0

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.3.3
  cupertino_icons: ^1.0.8

  # Storage / cache / i18n
  shared_preferences: ^2.5.3
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  freezed: ^4.0.2
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  generate: true
